<!DOCTYPE html>
<html>
<head>
    <title>Thorium Game Hub</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            background-color: #f0f0f0;
            color: #000;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff4500; text-shadow: 2px 2px #000; }
        #search {
            padding: 10px; width: 80%; max-width: 500px;
            font-family: "Comic Sans MS", cursive; font-size: 18px;
            border: 3px solid #000; border-radius: 10px; margin-bottom: 20px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px; max-width: 1200px; margin: 0 auto;
        }
        .card {
            background: #fff; border: 3px solid #000; border-radius: 10px;
            padding: 15px; box-shadow: 4px 4px 0px #000;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card h3 { margin: 0 0 5px 0; font-size: 18px; word-wrap: break-word; }
        .size { font-size: 12px; color: #666; margin-bottom: 10px; display: block; }
        .btn {
            display: inline-block; padding: 8px 15px; margin: 5px;
            background: #00ff00; border: 2px solid #000; border-radius: 5px;
            text-decoration: none; color: #000; font-weight: bold; cursor: pointer;
        }
        .btn.download { background: #00bfff; }
        .btn:hover { transform: scale(1.05); }
        iframe { width: 100%; height: 600px; border: 3px solid #000; display: none; margin-top: 20px; border-radius: 10px;}
        .player-container { max-width: 1000px; margin: 20px auto; text-align: left; }
    </style>
</head>
<body>
    <h1>🎮 Thorium Game Hub 🎮</h1>
    
    <div class="player-container">
        <input type="text" id="search" placeholder="Loading games..." onkeyup="filterGames()">
        <button class="btn" onclick="closePlayer()" id="close-btn" style="display:none;">Close Game</button>
        <iframe id="game-frame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
    </div>

    <div class="grid" id="game-grid"></div>

    <script>
        // Replace "immy-net" with your actual GitHub username if it's different!
        const GITHUB_USER = "immy-net"; 
        // Replace "Offline-HTML-Games-Pack" with your actual repo name!
        const GITHUB_REPO = "Offline-HTML-Games-Pack"; 

        async function loadGames() {
            try {
                // Fetch the list of files from your GitHub repo's offline folder
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/offline`);
                const data = await response.json();
                
                // Filter out anything that isn't an HTML file
                const games = data
                    .filter(file => file.name.endsWith('.html'))
                    .map(file => {
                        return {
                            name: file.name.replace('.html', '').replace(/-/g, ' ').replace(/_/g, ' ').toUpperCase(),
                            file: file.name,
                            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB'
                        };
                    });

                renderGames(games);
            } catch (error) {
                console.error("Error loading games:", error);
                document.getElementById('search').placeholder = "Error loading games. Check GitHub repo name.";
            }
        }

        function renderGames(games) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            document.getElementById('search').placeholder = `Search ${games.length} games...`;

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <h3>${game.name}</h3>
                        <span class="size">Size: ${game.size}</span>
                    </div>
                    <div>
                        <button onclick="playGame('offline/${game.file}')" class="btn">Play</button>
                        <a href="offline/${game.file}" download class="btn download">Download</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playGame(url) {
            const frame = document.getElementById('game-frame');
            frame.src = url;
            frame.style.display = 'block';
            document.getElementById('close-btn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            const frame = document.getElementById('game-frame');
            frame.src = 'about:blank';
            frame.style.display = 'none';
            document.getElementById('close-btn').style.display = 'none';
        }

        function filterGames() {
            const query = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        }

        loadGames();
    </script>
</body>
</html>
